<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b23"><title>Synthia · Relational World</title><link rel="stylesheet" href="ui/style.css"></head>
<body><template id="swarm-blueprint">
<header><a class="brand" href="./" aria-label="Synthia home"><span class="mark" aria-hidden="true">◌</span> synthia<span class="brand-note">one world · five dimensions</span></a><div class="header-actions"><button id="context-toggle" aria-expanded="false">Tools</button><button id="inspector-toggle" aria-expanded="false">Inspect</button><button id="save">Save journey</button><button id="export">Export</button><label class="file-button">Import<input id="import" type="file" accept="application/json,.json"></label></div></header>
<main>
 <aside class="journey" aria-label="World tools"><div class="section-label">Swarm context</div><h1>The adaptive swarm.</h1><p class="intro">One addressed substrate for bodies, tools, shapes, sound, and interaction.</p>
  <form id="onboarding"><label for="goal">What should the swarm explore?</label><textarea id="goal" maxlength="240" rows="2" placeholder="Music, making connections, exploring…">Explore and make connections</textarea><label for="pace">Choose your pace</label><select id="pace"><option value="gentle">Gentle</option><option value="exploratory" selected>Exploratory</option><option value="focused">Focused</option></select><button class="primary" type="submit">Initialize & learn <svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 15 15 5M5 5h10v10"/></svg></button></form>
  <section class="learning"><div class="section-label">Sheldon Klein · Boolean analogy</div><p>A:B :: C:D — six explicit features become a composed form.</p><label for="ato-a">A</label><input id="ato-a" value="111110" pattern="[01]{6}" maxlength="6"><label for="ato-b">B</label><input id="ato-b" value="010001" pattern="[01]{6}" maxlength="6"><label for="ato-c">C</label><input id="ato-c" value="100101" pattern="[01]{6}" maxlength="6"><button id="ato-compose">Compose analogy</button><output id="ato-result" aria-live="polite"></output></section>
  <section class="learning"><div class="section-label">Adaptive swarm</div><p id="learning-status">Assembly controller awaiting build trials.</p><button id="train">Learn from build attempts</button><div id="learned-capabilities"></div><label class="file-button">Learn from an image<input id="learn-image" type="file" accept="image/*"></label><p id="image-learning-status">Local visual regions; no invented depth.</p><button id="clear-image" hidden>Return to body assembly</button></section><div class="companion-note"><span class="companion-dot"></span><div><strong>Alongside you</strong><p id="companion-text" aria-live="polite">Choose a goal. I’ll prepare the room while you explore.</p></div></div>
  <section class="learning"><div class="section-label">Continuous agents</div><p id="autonomy-status" aria-live="polite">Local autonomy is paused.</p><button id="autonomy-toggle">Start agents</button><button id="autonomy-step">Advance one tick</button><label><input type="checkbox" id="autonomy-morph" checked> Allow tool morphology</label><button id="autonomy-save">Checkpoint agents</button><button id="autonomy-restore">Restore checkpoint</button><label class="file-button">Start world from JSON<input id="swarm-config" type="file" accept="application/json,.json"></label><button id="swarm-config-undo">Restore previous world</button><div id="autonomy-agents"></div><p class="small-note">Configurable agents · finite resources · 120-tick limit. Runs while this page is open; no shell or network permissions.</p></section>
  <section class="learning"><div class="section-label">Local function → form</div><p id="production-status" aria-live="polite">Run agents to form useful relationships.</p><label for="production-samples">Teach with [input, output] examples</label><textarea id="production-samples" rows="4" maxlength="4000" placeholder="Supply 6–64 [input, output] examples">[]</textarea><details><summary>Use my local coding model</summary><label for="production-provider">Local engine</label><select id="production-provider"><option value="embedded">Synthia Android embedded model</option><option value="ollama">Ollama on this device</option><option value="llamafile">llamafile on this device</option></select><label for="production-model">Installed model name</label><input id="production-model" value="qwen2.5-coder:1.5b"><button id="production-local">Ask local model for a proposal</button><p class="small-note">Embedded mode needs the existing Synthia Android host. Desktop engines must already be running and allow this browser origin.</p></details><button id="production-learn">Request a function from examples</button><label for="production-tool">Retained function</label><select id="production-tool"></select><label for="production-target">Existing world target</label><select id="production-target"><option value="player">Human body</option><option value="companion">Wolf companion</option><option value="world">World surface</option></select><button id="production-apply">Apply function</button><button id="production-release">Release target</button><button id="production-code">Download function code</button><button id="production-image">Save scene image</button><button id="production-video">Record scene clip</button><p class="small-note">Local operation composition and scene capture. No hosted AI or account required.</p></section>
  <section class="learning"><div class="section-label">Primitive composition</div><p id="primitive-status" aria-live="polite">Waiting for observed inputs and an output contract.</p><button id="primitive-toggle">Resume composition</button><button id="primitive-step">Execute one primitive</button><button id="primitive-save">Checkpoint composition</button><button id="primitive-restore">Restore checkpoint</button><div id="primitive-agents"></div><label for="primitive-inputs">Typed observations (JSON, optional; blank uses selection)</label><textarea id="primitive-inputs" placeholder="[{&quot;id&quot;:&quot;value&quot;,&quot;type&quot;:&quot;bits&quot;,&quot;value&quot;:[1,0]}]"></textarea><p class="small-note">Typed primitives discover executable graphs; verified clusters become primitives for later compositions. Pure local execution, bounded attempts, pause and checkpoints.</p></section><details id="fixtures"><summary>World test cases</summary><section class="paths" aria-label="Available paths"><div class="section-label">World test cases</div><div id="paths"></div></section></details>
  <button id="home" class="text-button" hidden>← Return to the room</button>
 </aside>
 <section class="workspace" aria-label="World workbench"><div class="view-toolbar"><div class="tabs" role="tablist" aria-label="Swarm expression"><button id="world-tab" role="tab" aria-selected="true">World</button><button id="embodied-tab" role="tab" aria-selected="false">Bodies</button><button id="function-tab" role="tab" aria-selected="false">Function</button></div><div class="view-controls"><button id="experience-start">Observe selection</button><button id="experience-close">World geometry</button><button id="morph-page">Morph interface</button><button id="morph">Morph body</button><button id="sound" aria-pressed="false">Sound off</button><button id="pause" aria-pressed="false">Pause</button></div></div>
  <div class="viewport"><canvas id="field-canvas" aria-label="Yi Jing relational world. Drag to orbit, scroll to zoom. Use Inspect to select any constituent with a keyboard."></canvas><canvas id="world-canvas" hidden aria-label="Interactive 3D world. Use the labeled path and activity buttons for keyboard access."></canvas><canvas id="function-canvas" aria-label="Shared entity and relation graph. All entities are also available in the inspector." hidden></canvas><div id="experience-host" hidden></div><div class="scene-caption"><span id="scene-kicker">SPACE / SHARED WORLD</span><h2 id="scene-title">One thing, viewed five ways.</h2></div><div id="busy" class="busy" role="status" hidden>Walking…</div><div id="webgl-error" hidden role="alert"></div></div>
  <form id="experience-request"><label for="experience-instruction">Output contract (JSON)</label><input id="experience-instruction" maxlength="4000" placeholder="{&quot;type&quot;:&quot;artifact&quot;}"><button type="submit">Compose</button><output id="experience-response" aria-live="polite"></output></form><section class="field-controls" aria-label="World interaction"><div id="field-dimensions" class="field-dimensions" aria-label="Dimensional perspective"></div><div class="field-actions"><button id="field-run">Pause composition</button><button id="field-step">One tick</button><button id="field-signal">Observe Boolean vector</button><button id="field-activate">Activate / rest</button><button id="field-enter">Enter constituent</button><button id="field-up">Parent frame</button><button id="field-reset-camera">Reset camera</button></div><p id="field-status" role="status"></p><p id="field-selection"></p></section><div class="activity"><div><h3 id="activity-title">Choose a door</h3><p id="activity-description">Each path is prepared before you enter. Your companion comes with you.</p></div><div id="activity-controls"></div></div>
  <div class="world-footer"><span id="world-status" role="status">Local world ready</span><span>Local prototype · example addresses</span></div>
 </section>
 <aside class="inspector" aria-label="Constituent inspector"><div class="section-label">The same thing, viewed five ways</div><label class="sr-only" for="entity-select">Inspect entity</label><select id="entity-select"></select><div id="entity-kind" class="entity-kind"></div>
  <div class="inspector-tabs"><button id="qualities-tab" aria-pressed="true">Qualities</button><button id="history-tab" aria-pressed="false">Lineage</button></div>
  <div id="quality-panel"><details id="simulation-controls"><summary>Simulation controls</summary><div id="dimensions"></div></details><p class="small-note">These scalar controls tune the preview; they are not the dimensional qualities. Explore the named qualities below.</p><div class="section-label spaced">Address</div><div id="address"></div><div class="line-controls"><label for="line">Changing line</label><select id="line"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><button id="change-line">Transform</button></div><div id="hexagram" aria-label="Hexagram"></div></div>
  <div id="history-panel" hidden></div>
  <div class="section-label spaced">Recursive dimensional qualities</div><div id="dimension-matrix"></div><div class="section-label spaced">Structural interactions</div><div id="field-edges"></div><button id="field-analyze">Analyze with tool factory</button><p id="field-analysis" class="small-note"></p><div class="section-label spaced">Function</div><div id="capabilities"></div><button id="resonate" class="secondary">Resolve with companion</button><p id="operator-result" class="small-note" aria-live="polite">Select an entity to inspect its relations and capabilities.</p>
 </aside>
</main>
<details id="ledger"><summary><span>Retained history</span><span id="event-count"></span></summary><div class="replay-bar"><label for="replay">Replay position</label><input id="replay" type="range" min="0" max="0" value="0"><output id="replay-position">Live</output><button id="live">Return to live</button><button id="unity-export">Export scene contract</button></div><p id="replay-note">Replay reconstructs recorded state. It does not regenerate model outputs.</p><ol id="events"></ol></details>
<details id="composer"><summary>Compose primitives</summary><p>A small executable grammar for testing recursive composition. This is the local workbench syntax.</p><label for="discourse">Primitive definitions and compositions</label><textarea id="discourse" rows="7" spellcheck="false">primitive letter.i "I" Movement;
primitive word.move "move" Movement;
sequence phrase = (
  letter.i,
  word.move
);
bundle expression = (phrase, companion);</textarea><button id="compile">Compose and retain lineage</button><output id="compile-result" aria-live="polite"></output></details>
<div id="notice" role="status" aria-live="polite"></div></template><div id="swarm-interface"></div><script type="module" src="ui/app.js"></script>
</body></html>
