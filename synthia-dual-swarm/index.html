<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b23"><title>Synthia · Function & Embodied</title><link rel="stylesheet" href="ui/style.css"></head>
<body><template id="swarm-blueprint">
<header><a class="brand" href="./" aria-label="Synthia home"><span class="mark" aria-hidden="true">◌</span> synthia<span class="brand-note">function + embodied</span></a><div class="header-actions"><button id="save">Save journey</button><button id="export">Export</button><label class="file-button">Import<input id="import" type="file" accept="application/json,.json"></label></div></header>
<main>
 <aside class="journey"><div class="section-label">Swarm context</div><h1>The adaptive<br>swarm.</h1><p class="intro">One addressed substrate for bodies, tools, shapes, sound, and interaction.</p>
  <form id="onboarding"><label for="goal">What should the swarm explore?</label><textarea id="goal" maxlength="240" rows="2" placeholder="Music, making connections, exploring…">Explore and make connections</textarea><label for="pace">Choose your pace</label><select id="pace"><option value="gentle">Gentle</option><option value="exploratory" selected>Exploratory</option><option value="focused">Focused</option></select><button class="primary" type="submit">Initialize & learn <svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 15 15 5M5 5h10v10"/></svg></button></form>
  <section class="learning"><div class="section-label">Adaptive swarm</div><p id="learning-status">Assembly controller awaiting build trials.</p><button id="train">Learn from build attempts</button><div id="learned-capabilities"></div><label class="file-button">Learn from an image<input id="learn-image" type="file" accept="image/*"></label><p id="image-learning-status">Local visual regions; no invented depth.</p><button id="clear-image" hidden>Return to body assembly</button></section><div class="companion-note"><span class="companion-dot"></span><div><strong>Alongside you</strong><p id="companion-text" aria-live="polite">Choose a goal. I’ll prepare the room while you explore.</p></div></div>
  <details id="fixtures"><summary>World test cases</summary><section class="paths" aria-label="Available paths"><div class="section-label">World test cases</div><div id="paths"></div></section></details>
  <button id="home" class="text-button" hidden>← Return to the room</button>
 </aside>
 <section class="workspace" aria-label="World workbench"><div class="view-toolbar"><div class="tabs" role="tablist" aria-label="Swarm expression"><button id="embodied-tab" role="tab" aria-selected="true">Embodied</button><button id="function-tab" role="tab" aria-selected="false">Function</button></div><div class="view-controls"><button id="morph-page">Morph interface</button><button id="morph">Morph body</button><button id="sound" aria-pressed="false">Sound off</button><button id="pause" aria-pressed="false">Pause</button></div></div>
  <div class="viewport"><canvas id="world-canvas" aria-label="Interactive 3D world. Use the labeled path and activity buttons for keyboard access."></canvas><canvas id="function-canvas" aria-label="Shared entity and relation graph. All entities are also available in the inspector." hidden></canvas><div class="scene-caption"><span id="scene-kicker">SPACE / THE MEETING FIELD</span><h2 id="scene-title">One room. Three beginnings.</h2></div><div id="busy" class="busy" role="status" hidden>Walking…</div><div id="webgl-error" hidden role="alert"></div></div>
  <div class="activity"><div><h3 id="activity-title">Choose a door</h3><p id="activity-description">Each path is prepared before you enter. Your companion comes with you.</p></div><div id="activity-controls"></div></div>
  <div class="world-footer"><span id="world-status" role="status">Local world ready</span><span>Local prototype · example addresses</span></div>
 </section>
 <aside class="inspector"><div class="section-label">The same thing, viewed five ways</div><label class="sr-only" for="entity-select">Inspect entity</label><select id="entity-select"></select><div id="entity-kind" class="entity-kind"></div>
  <div class="inspector-tabs"><button id="qualities-tab" aria-pressed="true">Qualities</button><button id="history-tab" aria-pressed="false">Lineage</button></div>
  <div id="quality-panel"><details id="simulation-controls"><summary>Simulation controls</summary><div id="dimensions"></div></details><p class="small-note">These scalar controls tune the preview; they are not the dimensional qualities. Explore the named qualities below.</p><div class="section-label spaced">Address</div><div id="address"></div><div class="line-controls"><label for="line">Changing line</label><select id="line"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><button id="change-line">Transform</button></div><div id="hexagram" aria-label="Hexagram"></div></div>
  <div id="history-panel" hidden></div>
  <div class="section-label spaced">Recursive dimensional qualities</div><div id="dimension-matrix"></div><div class="section-label spaced">Function</div><div id="capabilities"></div><button id="resonate" class="secondary">Resolve with companion</button><p id="operator-result" class="small-note" aria-live="polite">Select an entity to inspect its relations and capabilities.</p>
 </aside>
</main>
<details id="ledger"><summary><span>Retained history</span><span id="event-count"></span></summary><div class="replay-bar"><label for="replay">Replay position</label><input id="replay" type="range" min="0" max="0" value="0"><output id="replay-position">Live</output><button id="live">Return to live</button><button id="unity-export">Export scene contract</button></div><p id="replay-note">Replay reconstructs recorded state. It does not regenerate model outputs.</p><ol id="events"></ol></details>
<details id="composer"><summary>Compose primitives</summary><p>A small executable grammar for testing recursive composition. This is the local workbench syntax.</p><label for="discourse">Primitive definitions and compositions</label><textarea id="discourse" rows="7" spellcheck="false">primitive letter.i "I" Movement;
primitive word.move "move" Movement;
sequence phrase = (
  letter.i,
  word.move
);
bundle expression = (phrase, companion);</textarea><button id="compile">Compose and retain lineage</button><output id="compile-result" aria-live="polite"></output></details>
<div id="notice" role="status" aria-live="polite"></div></template><div id="swarm-interface"></div><script type="module" src="ui/app.js"></script>
</body></html>
