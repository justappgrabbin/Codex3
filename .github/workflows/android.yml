name: Android APK
on:
  push:
    branches: [codex/rule-based-dynamic-swarm]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci --prefix synthia-dual-swarm
      - run: npm test --prefix synthia-dual-swarm
      - run: node --test synthia-dual-swarm/tests/particle-field.test.mjs runtime/test.mjs
      - run: python android/build.py
      - run: node --test android/tests/native-runtime.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: synthia-codex3-development-apk
          path: |
            android/build/synthia-codex3-debug.apk
            android/build/receipt.json
